[versions]
agp = "9.1.1"
junit = "4.13.2"
lifecycleRuntimeCompose = "2.11.0"
activityCompose = "1.12.4"
kotlin = "2.2.10"
composeBom = "2026.09.00"
googleDevtoolsKsp = "2.3.5"
roomRuntime = "2.8.4"
roomCompiler = "2.8.4"
glanceAppwidget = "1.1.1"
kotlinxCoroutinesAndroid = "1.10.2"
kotlinxCoroutinesCore = "1.10.2"
core = "1.6.1"
